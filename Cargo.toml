[package]
name = "seal"
version = "0.3.0"
edition = "2024"
repository = "https://github.com/4rjxn/seal" 
description = "A rust based shell for linux based systems, (my daily driver)"
readme = "README.md"

[dependencies]
is_executable = "1.0.5"
mlua = { version = "0.11.6", features = ["lua55"] }
nix = { version = "0.31.2", features = ["fs", "hostname", "process", "signal", "user"] }
rustyline = { version = "17.0.2", features = ["with-file-history", "custom-bindings"] }
thiserror = "2.0.11"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
